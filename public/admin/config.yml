local_backend: true

backend:
  name: git-gateway
  branch: main

media_folder: public/images/uploads
public_folder: /images/uploads

collections:
  - name: settings
    label: Site
    files:
      - label: Contact and footer
        name: settings
        file: src/content/settings.json
        fields:
          - { label: Site name, name: siteName, widget: string }
          - { label: Title suffix, name: titleSuffix, widget: string }
          - { label: Phone, name: phone, widget: string }
          - { label: Phone link, name: phoneHref, widget: string }
          - { label: WhatsApp, name: whatsapp, widget: string }
          - { label: WhatsApp link, name: whatsappHref, widget: string }
          - { label: Email, name: email, widget: string }
          - { label: YouTube, name: youtube, widget: string }
          - { label: LinkedIn, name: linkedin, widget: string }
          - { label: Footer bio, name: footerBio, widget: text }
      - label: Homepage
        name: home
        file: src/content/home.json
        fields:
          - { label: Hero title, name: heroTitle, widget: string }
          - { label: Hero subtitle, name: heroSubtitle, widget: string }
          - { label: Bio title, name: bioTitle, widget: string }
          - { label: Bio, name: bio, widget: text }
          - { label: Portrait, name: portrait, widget: image }
          - { label: Learn title, name: learnTitle, widget: string }
          - { label: Learn heading, name: learnHeading, widget: string }
          - { label: Learn paragraphs, name: learnParagraphs, widget: list, field: { label: Paragraph, name: text, widget: text } }
          - { label: Brands title, name: brandsTitle, widget: string }
          - label: Press logos
            name: press
            widget: list
            fields:
              - { label: Image, name: src, widget: image }
              - { label: Alt, name: alt, widget: string }
          - label: Brand logos
            name: brands
            widget: list
            fields:
              - { label: Image, name: src, widget: image }
              - { label: Alt, name: alt, widget: string }
          - label: Testimonial
            name: testimonial
            widget: object
            fields:
              - { label: Quote, name: quote, widget: list, field: { label: Line, name: text, widget: text } }
              - { label: Name, name: name, widget: string }
              - { label: Role, name: role, widget: string }
              - { label: Logo, name: logo, widget: image }
          - { label: Smile title, name: smileTitle, widget: string }
          - { label: Sell title, name: sellTitle, widget: string }
          - label: Videos
            name: videos
            widget: list
            fields:
              - { label: YouTube id, name: id, widget: string }
              - { label: Title, name: title, widget: string }
          - label: Stats
            name: stats
            widget: list
            fields:
              - { label: Value, name: value, widget: string }
              - { label: Label, name: label, widget: string }
          - label: Services
            name: services
            widget: list
            fields:
              - { label: Anchor, name: id, widget: string }
              - { label: Title, name: title, widget: string }
              - { label: Paragraphs, name: paragraphs, widget: list, field: { label: Paragraph, name: text, widget: text } }

  - name: posts
    label: Blog
    folder: src/content/posts
    create: true
    slug: "{{slug}}"
    fields:
      - { label: Title, name: title, widget: string }
      - { label: Date, name: date, widget: datetime, date_format: "YYYY-MM-DD", time_format: false }
      - { label: Excerpt, name: excerpt, widget: text }
      - { label: Body, name: body, widget: markdown }

  - name: pages
    label: Pages
    folder: src/content/pages
    create: true
    slug: "{{slug}}"
    fields:
      - { label: Title, name: title, widget: string }
      - { label: Description, name: description, widget: text }
      - { label: Body, name: body, widget: markdown }
